version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omkar_nagu_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: omkar_secure_password_2026
      POSTGRES_DB: omkar_nagu_electrical
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omkar_nagu_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:omkar_secure_password_2026@postgres:5432/omkar_nagu_electrical?schema=public
      JWT_SECRET: omkar_nagu_electrical_works_secret_key_2026_super_secure
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omkar_nagu_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
